name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 离线自检（不发请求，无需 key）
        run: PYTHONPATH=src python scripts/selfcheck.py

      - name: 自检必须能发现被改坏的防呆
        run: |
          # 反向用例：故意把「某一档没配就报错」改成静默返回空字符串，
          # 自检必须因此失败。自检自己不设反向用例，就可能一直绿着却什么都没测。
          cp src/openrouter_client/config.py /tmp/config.bak
          python - <<'PYEOF'
          from pathlib import Path
          p = Path("src/openrouter_client/config.py")
          s = p.read_text(encoding="utf-8")
          broken = s.replace(
              'raise OpenRouterConfigError(f"未配置 {env_name}")',
              'return ""',
          )
          assert broken != s, "没能改坏，反向用例本身失效了"
          p.write_text(broken, encoding="utf-8")
          PYEOF
          if PYTHONPATH=src python scripts/selfcheck.py; then
            echo "反向用例失败：防呆被改坏后自检竟然还通过"
            cp /tmp/config.bak src/openrouter_client/config.py
            exit 1
          fi
          cp /tmp/config.bak src/openrouter_client/config.py
          echo "反向用例通过：改坏防呆后自检确实会红"

      - name: 可安装性检查
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
          python -c "import openrouter_client as m; print('wheel 可安装:', sorted(x for x in m.__all__ if not x.isupper())[:5])"
