name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 自检（不发任何请求，无需 key）
        run: |
          PYTHONPATH=src python - <<'PYEOF'
          import openrouter_client as oc

          # 缺 key 必须在构造配置时就失败
          try:
              oc.Config.from_env({})
              raise SystemExit("FAIL: 缺 key 时没有报错")
          except oc.OpenRouterConfigError:
              pass

          # key 格式不对也要立刻失败
          try:
              oc.Config.from_env({"OPENROUTER_API_KEY": "not-an-openrouter-key"})
              raise SystemExit("FAIL: key 格式错误时没有报错")
          except oc.OpenRouterConfigError:
              pass

          cfg = oc.Config.from_env({
              "OPENROUTER_API_KEY": "sk-or-v1-" + "x" * 64,
              "OPENROUTER_MODEL_IMAGE": "openai/gpt-image-2.5-sunburst",
              "OPENROUTER_MODEL_TEXT": "anthropic/claude-fable-5.1",
          })
          assert cfg.base_url == oc.DEFAULT_BASE_URL
          assert cfg.model_image == "openai/gpt-image-2.5-sunburst"

          # 未配生图模型时不能默默放行
          bare = oc.Config.from_env({"OPENROUTER_API_KEY": "sk-or-v1-" + "x" * 64})
          try:
              oc.generate_image("test", cfg=bare)
              raise SystemExit("FAIL: 未配模型时没有报错")
          except oc.OpenRouterConfigError:
              pass

          # 空 prompt 要挡住
          try:
              oc.generate_image("   ", cfg=cfg)
              raise SystemExit("FAIL: 空 prompt 没有报错")
          except ValueError:
              pass

          print("自检通过")
          PYEOF

      - name: 可安装性检查
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
          python -c "import openrouter_client; print('wheel 可安装，import 正常')"
