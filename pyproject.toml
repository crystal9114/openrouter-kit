[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrouter-kit"
version = "0.2.0"
description = "OpenRouter 文本、生图与跑批的统一封装，配置走环境变量"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_client"]
